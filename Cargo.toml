[workspace]
resolver = "2"
members = [
    "crates/encoding",
    "crates/crypto",
    "crates/identity",
    "crates/space",
    "crates/blob",
    "crates/sync",
    "crates/link",
    "crates/contact",
    "crates/update",
    "crates/cardinald",
    "crates/cardinal",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Daniel Wigton"]

[profile.dev.package."*"]
# Optimize dependencies (the cryptography especially) in debug builds so
# tests that run thousands of operations stay fast.
opt-level = 2

# The protocol crates do per-packet and per-chunk work; unoptimized they
# are 50-100x slower, which makes the end-to-end tests (and debug daemons)
# crawl.
[profile.dev.package.cardinal-encoding]
opt-level = 2
[profile.dev.package.cardinal-crypto]
opt-level = 2
[profile.dev.package.cardinal-link]
opt-level = 2
[profile.dev.package.cardinal-blob]
opt-level = 2
[profile.dev.package.cardinal-sync]
opt-level = 2

[workspace.dependencies]
# Internal crates.
cardinal-encoding = { path = "crates/encoding" }
cardinal-crypto = { path = "crates/crypto" }
cardinal-identity = { path = "crates/identity" }
cardinal-space = { path = "crates/space" }
cardinal-blob = { path = "crates/blob" }
cardinal-sync = { path = "crates/sync" }
cardinal-link = { path = "crates/link" }
cardinal-contact = { path = "crates/contact" }
cardinal-update = { path = "crates/update" }

# Cryptography (RustCrypto, dalek, BLAKE3 team, Zcash Foundation).
blake3 = { version = "1.8", features = ["zeroize"] }
curve25519-dalek = { version = "5.0", features = ["zeroize"] }
x25519-dalek = { version = "3.0", features = ["static_secrets", "zeroize"] }
ed25519-zebra = "5.0"
ml-kem = { version = "0.3", default-features = false, features = ["zeroize", "hazmat"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }
getrandom = "0.4"
subtle = "2.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# Networking (link and contact).
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
bytes = "1.10"
socket2 = { version = "0.6", features = ["all"] }

# Testing.
proptest = "1.12"
shake = "0.1"
serde_json = "1"
hex = "0.4"

# Command line and errors.
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"

# Installer and updater (HTTPS via rustls only; no OpenSSL).
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
toml = "1"
tempfile = "3"
