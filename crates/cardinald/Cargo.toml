[package]
name = "cardinald"
description = "The Cardinal daemon: stores, sync engine, link sessions, FUSE mount, control socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cardinal-encoding.workspace = true
cardinal-crypto.workspace = true
cardinal-identity.workspace = true
cardinal-space.workspace = true
cardinal-blob.workspace = true
cardinal-sync.workspace = true
cardinal-link.workspace = true
cardinal-contact.workspace = true
cardinal-update.workspace = true
cardinal-interface = { workspace = true, features = ["tracing"] }
toml.workspace = true
toml_edit = "0.25"
blake3.workspace = true
bytes = "1"
zeroize.workspace = true
hex.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
libc = "0.2"
# Pure-Rust mounting through fusermount3: no libfuse headers needed.
fuser = { version = "0.15", default-features = false, features = ["abi-7-19"], optional = true }
# gitignore syntax for `.cardinalignore` (fs/local.rs).
ignore = "0.4"

# The local interface's SOCK_SEQPACKET socket (transport.rs).
[target.'cfg(unix)'.dependencies]
socket2.workspace = true

# BlueZ over D-Bus for Bluetooth Low Energy (`bluez.rs`): pure Rust, no
# libdbus or libbluetooth.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.13", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
# The routing and neighbour tables (networks.rs), from the IP Helper API.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    # The local interface's named pipe, in message mode (transport.rs).
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
default = ["mount"]
# Show the files space as a folder, through FUSE.
mount = ["dep:fuser"]
# The handlers typed since, as they were by name: only to measure the two
# ways side by side (`benches/interface.rs`). The tests have them anyway.
by-name = []

[dev-dependencies]
tempfile.workspace = true

# What the local interface costs (`benches/interface.rs`): outside the test
# tiers, run by hand with `cargo bench -p cardinald --bench interface`.
[[bench]]
name = "interface"
harness = false
required-features = ["by-name"]
