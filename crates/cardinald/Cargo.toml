[package]
name = "cardinald"
description = "The Cardinal daemon: stores, sync engine, link sessions, FUSE mount, control socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cardinal-encoding.workspace = true
cardinal-crypto.workspace = true
cardinal-identity.workspace = true
cardinal-space.workspace = true
cardinal-blob.workspace = true
cardinal-sync.workspace = true
cardinal-link.workspace = true
cardinal-contact.workspace = true
blake3.workspace = true
zeroize.workspace = true
hex.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
libc = "0.2"
# Pure-Rust mounting through fusermount3: no libfuse headers needed.
fuser = { version = "0.15", default-features = false, features = ["abi-7-19"] }

[dev-dependencies]
tempfile = "3"
