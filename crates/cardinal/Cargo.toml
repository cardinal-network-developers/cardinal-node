[package]
name = "cardinal"
description = "Cardinal: one folder, the same on every device you own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "cardinal"
path = "src/main.rs"

[dependencies]
cardinald = { path = "../cardinald" }
cardinal-update.workspace = true
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
cardinal-crypto.workspace = true
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
blake3.workspace = true
cardinal-encoding.workspace = true
cardinal-link.workspace = true
cardinal-sync.workspace = true
